<!--
  Redpoint Advisors — SharePoint intranet banner
  Fixed 1200x250, sized to sit inside a standard one-column web part.
  Mirrors the brand system from redpointadvisors.com: logo mark, colors,
  and an original rotating particle-globe effect (not their source, same idea).
  Paste this whole block into a Script Editor / Embed web part.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">

<style>
  .rp-banner {
    --rp-bg: #1b1413;
    --rp-fg: #e4e2dc;
    --rp-accent: #c4283a;

    position: relative;
    width: 1200px;
    height: 250px;
    max-width: 100%;
    overflow: hidden;
    background: var(--rp-bg);
    box-shadow: 0 1px 0 var(--rp-accent);
    font-family: 'Michroma', sans-serif;
  }

  .rp-banner__canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    -webkit-mask-image: radial-gradient(ellipse 70% 90% at 68% 50%, #000 55%, transparent 100%);
    mask-image: radial-gradient(ellipse 70% 90% at 68% 50%, #000 55%, transparent 100%);
  }

  .rp-banner__fade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, var(--rp-bg) 0%, var(--rp-bg) 18%, rgba(27, 20, 19, 0) 55%);
    pointer-events: none;
  }

  .rp-banner__brand {
    position: absolute;
    left: 40px;
    top: 50%;
    transform: translateY(-50%);
  }

  .rp-banner__logo {
    display: block;
    color: var(--rp-fg);
  }

  .rp-banner__logo svg {
    height: 20px;
    width: auto;
    display: block;
    fill: currentColor;
  }

  .rp-banner__tagline {
    margin-top: 12px;
    padding-left: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(228, 226, 220, 0.5);
  }
</style>

<div class="rp-banner">
  <canvas class="rp-banner__canvas" id="rp-globe"></canvas>
  <div class="rp-banner__fade"></div>

  <div class="rp-banner__brand">
  <a class="rp-banner__logo" href="/" aria-label="Redpoint home">

    </svg>
  </a>
  <div class="rp-banner__tagline">Advisor Hub</div>
  </div>
</div>

<script>
(function () {
  var canvas = document.getElementById('rp-globe');
  var ctx = canvas.getContext('2d');
  var wrap = canvas.parentElement;
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  var W = wrap.clientWidth || 1200;
  var H = wrap.clientHeight || 250;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.scale(DPR, DPR);

  var N = 650;
  var points = [];
  for (var i = 0; i < N; i++) {
    var yv = 1 - (i / (N - 1)) * 2;
    var r = Math.sqrt(1 - yv * yv);
    var theta = Math.PI * (1 + Math.sqrt(5)) * i;
    points.push({
      x: Math.cos(theta) * r,
      y: yv,
      z: Math.sin(theta) * r,
      accent: Math.random() > 0.95
    });
  }

  var radius = Math.min(W, H) * 0.62;
  var cx = W * 0.68;
  var cy = H * 0.52;
  var tilt = 0.36;
  var angle = 0;
  var cosT = Math.cos(tilt), sinT = Math.sin(tilt);

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw() {
    ctx.clearRect(0, 0, W, H);
    var cosA = Math.cos(angle), sinA = Math.sin(angle);

    var proj = new Array(N);
    for (var i = 0; i < N; i++) {
      var p = points[i];
      var x1 = p.x * cosA - p.z * sinA;
      var z1 = p.x * sinA + p.z * cosA;
      var y2 = p.y * cosT - z1 * sinT;
      var z2 = p.y * sinT + z1 * cosT;
      proj[i] = { x: x1, y: y2, z: z2, accent: p.accent };
    }
    proj.sort(function (a, b) { return a.z - b.z; });

    for (var j = 0; j < proj.length; j++) {
      var pr = proj[j];
      var depth = (pr.z + 1.5) / 2.5;
      var sx = cx + pr.x * radius;
      var sy = cy + pr.y * radius;
      var size = 0.5 + depth * 1.5;
      var alpha = 0.12 + depth * 0.6;

      ctx.beginPath();
      ctx.fillStyle = pr.accent
        ? 'rgba(196, 40, 58, ' + alpha + ')'
        : 'rgba(228, 226, 220, ' + alpha + ')';
      ctx.arc(sx, sy, size, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!reduceMotion) {
      angle += 0.0018;
      requestAnimationFrame(draw);
    }
  }

  draw();
})();
</script>
